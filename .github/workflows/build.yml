name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk mortar-fdc.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mortar-fdc-apk
          path: mortar-fdc.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" mortar-fdc.apk --title "박격포 사격지휘소 v0.${{ github.run_number }}" --notes "테스트용 APK"
      - name: Publish web version
        run: |
          mkdir site && cp app/src/main/assets/index.html site/ && touch site/.nojekyll
          cd site && git init -q -b gh-pages && git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "web build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
